name: bazel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      # No submodules needed — every dependency is a bazel_dep

    - name: Cache Bazel outputs
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'bazel/registry/**') }}
        restore-keys: |
          bazel-${{ runner.os }}-

    - name: Build kepler-formal
      run: bazelisk build //src/bin:kepler-formal

    - name: Run tests
      run: bazelisk test //test/...
