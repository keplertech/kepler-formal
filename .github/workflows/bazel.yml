name: bazel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      # No submodules needed — Bazel fetches deps via http_archive

    - name: Verify Bazel Naja pin matches checked-in submodule
      run: |
        bazel_naja_commit="$(sed -n 's/^_NAJA_COMMIT = \"\\(.*\\)\"/\\1/p' bazel/deps.bzl)"
        gitlink_naja_commit="$(git rev-parse HEAD:thirdparty/naja)"
        if [ -z "${bazel_naja_commit}" ]; then
          echo "Failed to read _NAJA_COMMIT from bazel/deps.bzl"
          exit 1
        fi
        if [ "${bazel_naja_commit}" != "${gitlink_naja_commit}" ]; then
          echo "Bazel Naja pin mismatch"
          echo "bazel/deps.bzl _NAJA_COMMIT: ${bazel_naja_commit}"
          echo "thirdparty/naja gitlink: ${gitlink_naja_commit}"
          exit 1
        fi

    - name: Cache Bazel outputs
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'bazel/deps.bzl', 'bazel/naja.BUILD.bazel') }}
        restore-keys: |
          bazel-${{ runner.os }}-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          build-essential pkg-config \
          libboost-all-dev libtbb-dev capnproto libcapnp-dev \
          libfl-dev zlib1g-dev python3-dev

    - name: Build kepler-formal
      run: bazelisk build //src/bin:kepler-formal

    - name: Dump rules_foreign_cc CMake log on failure
      if: failure()
      run: |
        find bazel-out -type f -name CMake.log -print -exec sed -n '1,260p' {} \; || true

    - name: Run tests
      run: bazelisk test //test/...
