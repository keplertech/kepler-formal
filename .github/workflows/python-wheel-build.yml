name: Build Python wheels

on:
  workflow_call:
    inputs:
      provider:
        description: NajaEDA provider (development or published)
        type: string
        required: true
      version:
        description: Confirm the package version for published-provider builds
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04
            platform: manylinux_2_28
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: manylinux_2_28
            arch: aarch64
          # Vendored Slang requires a newer AppleClang than Xcode 15.4 on the
          # macos-14 image.  The repository's macOS build also uses latest.
          - os: macos-latest
            platform: macOS
            arch: arm64
          - os: windows-latest
            platform: Windows
            arch: AMD64
    runs-on: ${{ matrix.os }}
    env:
      KEPLER_USE_PUBLISHED_NAJAEDA: ${{ inputs.provider == 'published' && '1' || '0' }}
      # Linux builds and tests run inside a manylinux container.
      CIBW_ENVIRONMENT_PASS_LINUX: KEPLER_USE_PUBLISHED_NAJAEDA

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Prepare Python provider metadata
        run: python ci/prepare_python_release.py --project .

      - name: Install Windows wheel repair tool
        if: runner.os == 'Windows'
        run: python -m pip install delvewheel

      - name: Set up Windows SDK and MSVC environment for clang-cl
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate Python release request
        if: ${{ inputs.provider == 'published' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python ci/prepare_python_release.py --project . --validate-publish

      - name: Verify recursive submodules
        run: git submodule status --recursive

      - name: Download generated parser for Windows
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: kepler-verilog-parser
          path: thirdparty/naja/thirdparty/naja-verilog/src/generated

      - name: Build, repair, and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kepler-formal-${{ inputs.provider }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
