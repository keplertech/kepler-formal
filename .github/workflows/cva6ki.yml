name: cva6ki

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cva6-ki:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtest-dev cmake pkg-config libboost-dev libfl-dev \
          capnproto libcapnp-dev ninja-build libtbb-dev libspdlog-dev \
          libboost-iostreams-dev zlib1g-dev

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -GNinja \
          -DPYTHON_INTERFACE=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_FLAGS="-O3 -ffast-math -flto -DNDEBUG" \
          -DCMAKE_CXX_FLAGS_RELEASE="-Ofast -ffast-math -flto -DNDEBUG" \
          -DCMAKE_EXE_LINKER_FLAGS="-flto"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Install kepler-formal
      run: cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/stage

    - name: Restore executable bit
      run: chmod +x ${{github.workspace}}/stage/bin/kepler-formal

    - name: Clone kepler-formal-regress
      working-directory: ${{github.workspace}}
      run: git clone https://github.com/keplertech/kepler-formal-regress

    - name: Show runner memory
      run: |
        free -h
        grep MemTotal /proc/meminfo
        nproc
        ps -eo pid,%mem,rss,cmd --sort=-rss | head

    - name: Run CVA6 SEC k-induction
      working-directory: ${{github.workspace}}
      run: |
        cd kepler-formal-regress/cva6
        export CVA6_REPO_DIR="$PWD"
        export HPDCACHE_DIR="$PWD/core/cache_subsystem/hpdcache"
        export TARGET_CFG="cv64a6_imafdc_sv39"
        export LD_LIBRARY_PATH="${{github.workspace}}/stage/lib:${LD_LIBRARY_PATH}"
        set +e
        "${{github.workspace}}/stage/bin/kepler-formal" -systemverilog \
          --compact \
          -v sec \
          -k 4 \
          --sec-engine k_induction \
          --sv_design1_flist "$PWD/core/Flist.cva6" \
          --sv_design1_top cva6 \
          --sv_design2_flist "$PWD/core/Flist.cva6" \
          --sv_design2_top cva6 2>&1 | tee "${RUNNER_TEMP}/cva6-ki.log"
        status=${PIPESTATUS[0]}
        set -e
        # Positive self-SEC accepts a proved or explicitly partial verdict.
        if [[ "${status}" -eq 1 ]] &&
            grep -q "SEC partially proved equivalence" "${RUNNER_TEMP}/cva6-ki.log"; then
          exit 0
        fi
        exit "${status}"
