name: nix

on:
  pull_request:
  push:
    branches: [main, nixOS]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: keplertech
          skipPush: true
      - name: Check installed package
        run: nix flake check --system ${{ matrix.system }} --print-build-logs --no-update-lock-file
      - name: Build CLI package
        run: nix build .#packages.${{ matrix.system }}.default --print-build-logs --no-update-lock-file
      - name: Publish CLI package
        if: github.repository == 'keplertech/kepler-formal' && github.event_name == 'workflow_dispatch'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          : "${CACHIX_AUTH_TOKEN:?Set the CACHIX_AUTH_TOKEN repository secret}"
          package_path=$(nix path-info ./result)
          cachix push keplertech "$package_path"
          cachix pin keplertech "kepler-formal-$NIX_SYSTEM" "$package_path" --keep-revisions 20
      - name: Verify public cache download
        if: github.repository == 'keplertech/kepler-formal' && github.event_name == 'workflow_dispatch'
        run: |
          package_path=$(nix path-info ./result)
          nix path-info --store https://keplertech.cachix.org "$package_path" \
            --option narinfo-cache-negative-ttl 0
          verify_root=$(mktemp -d "$RUNNER_TEMP/cachix-verify.XXXXXX")
          nix-store --store "$verify_root" --realise "$package_path" \
            --max-jobs 0 --option builders '' \
            --option substituters 'https://keplertech.cachix.org https://cache.nixos.org' \
            --option extra-substituters '' --option narinfo-cache-negative-ttl 0

  test-prebuilt-install:
    # PR/push runs do not publish. After manual publication, verify real profile
    # installation on fresh runners that cannot reuse the preceding build.
    needs: build-and-check
    if: github.repository == 'keplertech/kepler-formal' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/nix-prebuilt.yml
    with:
      ref: ${{ github.ref_name }}
      revision: ${{ github.sha }}
