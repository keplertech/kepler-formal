name: SEC regression summary

on:
  workflow_run:
    workflows: [regress-sec]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    # workflow_run uses the default branch. Never execute code from the PR or
    # downloaded artifacts in this follow-up workflow.
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Read regression job results
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
            ...context.repo,
            run_id: context.payload.workflow_run.id,
            filter: 'all',
            per_page: 100,
          });
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'sec-jobs.json'), JSON.stringify(jobs));

    - name: Download regression results
      id: results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: sec-regress-results-*
        path: ${{ runner.temp }}/sec-results
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate results table
      env:
        SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        DOWNLOAD_OUTCOME: ${{ steps.results.outcome }}
      run: |
        python3 regress/summarize_sec_regress.py \
          --jobs "${RUNNER_TEMP}/sec-jobs.json" \
          --artifacts "${RUNNER_TEMP}/sec-results" \
          --run-url "${SOURCE_RUN_URL}" \
          --run-attempt "${SOURCE_RUN_ATTEMPT}" \
          --output "${RUNNER_TEMP}/sec-regression-summary.md"
        if [[ "${DOWNLOAD_OUTCOME}" != "success" ]]; then
          printf '\nWarning: result artifacts could not all be downloaded; unavailable measurements are shown as missing.\n' >> "${RUNNER_TEMP}/sec-regression-summary.md"
        fi
        cat "${RUNNER_TEMP}/sec-regression-summary.md" >> "${GITHUB_STEP_SUMMARY}"

    - name: Save results table
      uses: actions/upload-artifact@v4
      with:
        name: sec-regression-summary
        path: ${{ runner.temp }}/sec-regression-summary.md
        retention-days: 30
        if-no-files-found: error
