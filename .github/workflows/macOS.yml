name: asan-build-macos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Checkout submodules
      run: git submodule update --init --recursive
    # install dependencies
    - name: Install dependencies
      run: brew install cmake doxygen capnp tbb bison flex boost spdlog zlib abseil protobuf openssl@3 llvm z3 re2 googletest
    - name: set env variable
      run: |
        echo "/usr/local/opt/flex/bin" >> $GITHUB_PATH; echo "/usr/local/opt/bison/bin" >> $GITHUB_PATH;
        echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH; echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
        echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm);$(brew --prefix openssl@3);$(brew --prefix abseil);$(brew --prefix protobuf);$(brew --prefix re2);$(brew --prefix z3)" >> $GITHUB_ENV
    - name: Install OR-Tools headers
      run: |
        ORTOOLS_VERSION=9.15
        ORTOOLS_HEADER=/usr/local/include/ortools/graph/graph.h
        if [ ! -f "${ORTOOLS_HEADER}" ]; then
          WORK_DIR="${RUNNER_TEMP}/or-tools-${ORTOOLS_VERSION}"
          SRC_DIR="${WORK_DIR}/src"
          rm -rf "${WORK_DIR}"
          mkdir -p "${SRC_DIR}"
          curl -L \
            "https://github.com/google/or-tools/releases/download/v${ORTOOLS_VERSION}/or-tools-${ORTOOLS_VERSION}.tar.gz" \
            -o "${WORK_DIR}/or-tools.tar.gz"
          tar -xzf "${WORK_DIR}/or-tools.tar.gz" \
            -C "${SRC_DIR}" \
            --strip-components=1
          sudo mkdir -p /usr/local/include
          sudo cp -R "${SRC_DIR}/ortools" /usr/local/include/
        fi
        echo "CPATH=/usr/local/include${CPATH:+:${CPATH}}" >> "${GITHUB_ENV}"
        echo "CPLUS_INCLUDE_PATH=/usr/local/include${CPLUS_INCLUDE_PATH:+:${CPLUS_INCLUDE_PATH}}" >> "${GITHUB_ENV}"
        echo "CXXFLAGS=-I/usr/local/include${CXXFLAGS:+ ${CXXFLAGS}}" >> "${GITHUB_ENV}"
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -GNinja -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DCMAKE_CXX_FLAGS="-I/usr/local/include" -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" -DENABLE_SANITIZERS=ON -DPYTHON_INTERFACE=OFF -DCMAKE_CXX_STANDARD=20
    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        PYTHONMALLOC: malloc
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -VV -E ".*[p|P]ython.*" -C ${{env.BUILD_TYPE}}
