name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bazelisk
      uses: bazel-contrib/setup-bazel@v0.15.0
      with:
        bazelisk-version: latest

    - name: Cache Bazel outputs
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-release-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'bazel/deps.bzl', 'bazel/naja.BUILD.bazel') }}
        restore-keys: |
          bazel-release-${{ runner.os }}-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          build-essential pkg-config \
          libboost-dev libtbb-dev capnproto libcapnp-dev \
          libfl-dev zlib1g-dev python3-dev

    - name: Build (optimized)
      run: bazelisk build -c opt //src/bin:kepler-formal

    - name: Package
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        DIST="kepler-formal-${VERSION}-linux-x86_64"
        mkdir -p "${DIST}/bin" "${DIST}/lib"

        # Copy the binary
        cp bazel-bin/src/bin/kepler-formal "${DIST}/bin/"

        # Ship the top-level docs users expect alongside a binary release.
        cp README.md LICENSE.rst "${DIST}/"

        # Bundle naja shared libs (built by rules_foreign_cc cmake)
        find bazel-bin/ -name 'libnaja_*.so' -exec cp {} "${DIST}/lib/" \;
        if ! find "${DIST}/lib" -maxdepth 1 -name 'libnaja_*.so' | grep -q .; then
          echo "Expected bundled naja shared libraries were not found."
          exit 1
        fi

        # Bundle TBB (no static libs available by design)
        for lib in libtbb.so.12 libtbbmalloc.so.2; do
          cp "/lib/x86_64-linux-gnu/${lib}" "${DIST}/lib/"
        done

        # Create wrapper script that sets LD_LIBRARY_PATH for bundled libs
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
          'export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
          'exec "${SCRIPT_DIR}/bin/kepler-formal" "$@"' \
          > "${DIST}/kepler-formal"
        chmod +x "${DIST}/kepler-formal"

        tar czf "${DIST}.tar.gz" "${DIST}"
        sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

    - name: Verify
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        DIST="kepler-formal-${VERSION}-linux-x86_64"
        echo "=== ldd output ==="
        ldd "${DIST}/bin/kepler-formal"
        echo "=== smoke test ==="
        "./${DIST}/kepler-formal" --help || true

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        gh release create "${GITHUB_REF_NAME}" \
          --title "kepler-formal ${VERSION}" \
          --generate-notes \
          "kepler-formal-${VERSION}-linux-x86_64.tar.gz" \
          "kepler-formal-${VERSION}-linux-x86_64.tar.gz.sha256"
