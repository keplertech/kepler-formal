name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bazelisk
      uses: bazel-contrib/setup-bazel@v0.15.0
      with:
        bazelisk-version: latest

    - name: Cache Bazel outputs
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-release-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'bazel/registry/**') }}
        restore-keys: |
          bazel-release-${{ runner.os }}-

    - name: Build (optimized)
      run: bazelisk build -c opt //src/bin:kepler-formal

    - name: Package
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        DIST="kepler-formal-${VERSION}-linux-x86_64"
        mkdir -p "${DIST}/bin" "${DIST}/lib"

        # Copy the binary
        cp bazel-bin/src/bin/kepler-formal "${DIST}/bin/"
        cp bazel-bin/src/bin/naja.so "${DIST}/bin/"

        # Ship the top-level docs and optional local MCP package.
        cp README.md LICENSE.rst "${DIST}/"
        cp -R mcp "${DIST}/mcp"

        # Bundle the Naja shared runtime.
        find bazel-bin/ -name 'libnaja_*.so' -exec cp {} "${DIST}/lib/" \;
        if ! find "${DIST}/lib" -maxdepth 1 -name 'libnaja_*.so' | grep -q .; then
          echo "Expected bundled naja shared libraries were not found."
          exit 1
        fi

        # Bundle the hermetic Python runtime the binary embeds (libpython
        # and its stdlib) from the binary's runfiles.
        PY_RUNTIME=$(find -L bazel-bin/src/bin/kepler-formal.runfiles -maxdepth 1 -name 'rules_python++python+python_3_*' -print -quit)
        test -n "${PY_RUNTIME}" || { echo "missing bundled Python runtime"; exit 1; }
        cp -RL "${PY_RUNTIME}" "${DIST}/python"

        # Create wrapper script that points the binary at the bundled libs
        # and Python runtime.
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
          'export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${SCRIPT_DIR}/python/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
          'export PYTHONHOME="${PYTHONHOME:-${SCRIPT_DIR}/python}"' \
          'exec "${SCRIPT_DIR}/bin/kepler-formal" "$@"' \
          > "${DIST}/kepler-formal"
        chmod +x "${DIST}/kepler-formal"

        tar czf "${DIST}.tar.gz" "${DIST}"
        sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

    - name: Verify
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        DIST="kepler-formal-${VERSION}-linux-x86_64"
        echo "=== ldd output ==="
        ldd "${DIST}/bin/kepler-formal"
        echo "=== hermetic toolchain checks ==="
        # libc++ is statically linked by the hermetic toolchain.
        if ldd "${DIST}/bin/kepler-formal" | grep -E "libstdc\+\+|libc\+\+"; then
          echo "unexpected dynamic C++ runtime dependency"; exit 1
        fi
        # glibc floor: hermetic toolchain targets 2.28 for portability.
        MAX_GLIBC=$(objdump -T "${DIST}/bin/kepler-formal" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
        echo "max glibc symbol: ${MAX_GLIBC}"
        printf '%s\n' "${MAX_GLIBC#GLIBC_}" 2.28 | sort -CV || { echo "glibc floor regressed above 2.28"; exit 1; }
        readelf -p .comment "${DIST}/bin/kepler-formal" | grep clang
        echo "=== smoke test ==="
        "./${DIST}/kepler-formal" --help || true
        "./${DIST}/kepler-formal" --version

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        gh release create "${GITHUB_REF_NAME}" \
          --title "kepler-formal ${VERSION}" \
          --generate-notes \
          "kepler-formal-${VERSION}-linux-x86_64.tar.gz" \
          "kepler-formal-${VERSION}-linux-x86_64.tar.gz.sha256"
