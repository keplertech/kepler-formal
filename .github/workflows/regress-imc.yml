# GitHub Actions workflow to run SEC IMC regressions.
name: regress-imc

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sec_encoding:
        required: false
        type: string
        default: "binary"
      positive_expectation:
        required: false
        type: string
        default: "allow-unset-state-inconclusive"

env:
  SEC_ENGINE: imc
  SEC_ENCODING: ${{ inputs.sec_encoding || 'binary' }}
  # The base non-dual IMC workflow allows inconclusive positive proofs and the
  # reset-unanchored no-output case. Reusable callers keep their explicit
  # expectation.
  SEC_POSITIVE_EXPECTATION: ${{ inputs.positive_expectation || 'allow-unset-state-inconclusive' }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtest-dev cmake pkg-config libboost-dev libfl-dev \
          capnproto libcapnp-dev ninja-build libtbb-dev libspdlog-dev \
          libboost-iostreams-dev zlib1g-dev

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build-sec-regress \
          -GNinja \
          -DPYTHON_INTERFACE=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_FLAGS="-O3 -ffast-math -flto -DNDEBUG" \
          -DCMAKE_CXX_FLAGS_RELEASE="-Ofast -ffast-math -flto -DNDEBUG" \
          -DCMAKE_EXE_LINKER_FLAGS="-flto"

    - name: Build
      run: cmake --build ${{github.workspace}}/build-sec-regress --target kepler-formal --config Release

    - name: Clone kepler-formal-regress
      working-directory: ${{github.workspace}}
      run: git clone https://github.com/keplertech/kepler-formal-regress

    - name: Clone kepler-formal-examples
      working-directory: ${{github.workspace}}
      run: git clone https://github.com/keplertech/kepler-formal-examples

    - name: Run external SEC regressions
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_sec_strategies_regress.sh \
          cts_aes_asap7_base \
          "${{github.workspace}}/kepler-formal-regress/cts_aes_asap7_base" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          objects/asap7/aes/base/4_rsz_lec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          sky130hd_gcd \
          "${{github.workspace}}/kepler-formal-regress/sky130hd_gcd" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          objects/sky130hd/gcd/base/4_rsz_lec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          nangate45_black_parrot \
          "${{github.workspace}}/kepler-formal-regress/nangate45_black_parrot" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          objects/nangate45/bp/base/4_rsz_lec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          ihp_sg13g2_i2c_gpio_expander \
          "${{github.workspace}}/kepler-formal-regress/ihp-sg13g2_i2c-gpio-expander" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          objects/ihp-sg13g2/i2c-gpio-expander/base/4_rsz_lec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          nangate45_dynamic_node \
          "${{github.workspace}}/kepler-formal-examples/nangate45_dynamic_node" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          asap7_jpeg_lvt \
          "${{github.workspace}}/kepler-formal-examples/asap7_jpeg_lvt" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          sky130hs_ibex \
          "${{github.workspace}}/kepler-formal-examples/sky130hs_ibex" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          sky130hd_riscv32i \
          "${{github.workspace}}/kepler-formal-examples/sky130hd_riscv32i" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          sky130hs_riscv32i \
          "${{github.workspace}}/kepler-formal-examples/sky130hs_riscv32i" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          nangate45_ibex \
          "${{github.workspace}}/kepler-formal-examples/nangate45_ibex" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          nangate45_swerv \
          "${{github.workspace}}/kepler-formal-examples/nangate45_swerv" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          nangate45_ariane136 \
          "${{github.workspace}}/kepler-formal-examples/nangate45_ariane136" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          asap7_ethmac \
          "${{github.workspace}}/kepler-formal-examples/asap7_ethmac" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          asap7_mock_alu \
          "${{github.workspace}}/kepler-formal-examples/asap7_mock-alu" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        # In binary IMC this remains an equivalence check; in dual-rail IMC it
        # is measured without stopping the rest of the workflow on inconclusive.
        bash regress/run_sec_strategies_regress.sh \
          asap7_mock_cpu \
          "${{github.workspace}}/kepler-formal-examples/asap7_mock_cpu" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        # BP final has resetless FIFO state. The regular IMC workflow uses the
        # requested encoding; the dual-rail wrapper measures dual-rail progress.
        bash regress/run_sec_strategies_regress.sh \
          nangate45_black_parrot_sec_final \
          "${{github.workspace}}/kepler-formal-examples/nangate45_black_parrot_sec_final" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          6_final_sec_test.yml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}

    - name: Run TinyRocket SEC regressions
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_sec_strategies_regress.sh \
          tinyrocket_naja_if \
          "${{github.workspace}}" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          regress/tinyrocket_naja_if/config.yaml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          tinyrocket_verilog \
          "${{github.workspace}}" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          regress/tinyrocket_verilog/config.yaml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}

    - name: Install najaeda
      run: pip install najaeda==0.7.18

    - name: Generate TinyRocket edited and CSRFile SEC examples
      working-directory: ${{github.workspace}}/example
      run: |
        python edit.py
        python extract_tinyrocket_csrfile_sec.py

    - name: Run TinyRocket SEC self-check
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_sec_strategies_regress.sh \
          tinyrocket_self_sec \
          "${{github.workspace}}/example" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          test_config_verilog_tinyrocket_sec.yaml \
          ${{ env.SEC_POSITIVE_EXPECTATION }} \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          tinyrocket_csrfile_sec \
          "${{github.workspace}}/example" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          test_config_verilog_tinyrocket_csrfile_sec.yaml \
          expect-different \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}

    - name: Run TinyRocket edited SEC regressions
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_sec_strategies_regress.sh \
          tinyrocket_naja_if_edited_sec_probe \
          "${{github.workspace}}" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          regress/tinyrocket_naja_if_edited_sec_probe/config.yaml \
          expect-different \
          max-k=1 \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
        bash regress/run_sec_strategies_regress.sh \
          tinyrocket_verilog_edited_sec_probe \
          "${{github.workspace}}" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          regress/tinyrocket_verilog_edited_sec_probe/config.yaml \
          expect-different \
          max-k=1 \
          compact \
          engine=${{ env.SEC_ENGINE }} \
          sec-encoding=${{ env.SEC_ENCODING }}
