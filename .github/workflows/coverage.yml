name: coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

    - name: Checkout submodules
      run: git submodule update --init --recursive
 
    - name: Install system dependencies
      run: bash .github/scripts/install-cmake-deps-ubuntu.sh lcov

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: core.abbrev
        GIT_CONFIG_VALUE_0: "7"
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_PREFIX_PATH="/usr/local;/usr/lib/llvm-22" -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-22 -DCODE_COVERAGE=ON -DLONG_TESTS=ON -DCMAKE_CXX_STANDARD=20

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build -j 4 --config ${{env.BUILD_TYPE}}
      env:
        CC:   clang-22
        CXX:  clang++-22

    - name: Generate Naja IF test inputs with the local Naja checkout
      working-directory: ${{github.workspace}}/example
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: core.abbrev
        GIT_CONFIG_VALUE_0: "7"
      run: |
        python3 -m pip install --upgrade "scikit-build-core>=0.11.3,<0.12"
        CMAKE_ARGS="-DPREGENERATED_PARSER_SOURCES=OFF" \
          python3 -m pip install --no-build-isolation "${{github.workspace}}/thirdparty/naja"
        python3 to_naja_if.py
        python3 edit.py

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        PYTHONMALLOC: malloc
      run: ctest -VV -C ${{ env.BUILD_TYPE }}
    - name: lcov
      working-directory: ${{github.workspace}}/build
      run: |
           lcov --directory . --capture --output-file coverage.info
           lcov --remove coverage.info --output-file coverage.info '/usr/*' '*/test/*' '*/kepler-formal/thirdparty/*' '*/kepler-formal/build*/thirdparty/*'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: true
        file: ${{github.workspace}}/build/coverage.info
        disable_search: true
        files: coverage.info
        flags: unittests
        name: codecov-umbrella
        verbose: true
