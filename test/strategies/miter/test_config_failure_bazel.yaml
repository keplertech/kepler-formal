# tinyrocket_config.yaml (Bazel runfiles paths)
format: naja_if
input_paths:
  - examples/tinyrocket/tinyrocket_naja.if
  - examples/tinyrocket/tinyrocket_naja_edited.if
liberty_files:
  - examples/tinyrocket/NangateOpenCellLibrary_typical.lib
  - examples/tinyrocket/fakeram45_1024x32.lib
  - examples/tinyrocket/fakeram45_64x32.lib
log_level: info
use_scopes: true
clean_scopes: true
solver: failure

