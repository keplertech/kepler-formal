# RTL 03 with its register copy left valid after the early read: not
# equivalent, also with eight clock cycles per step.
format: systemverilog
input_paths:
  - ./regress/c4004_rtl/rtl_01.v
  - ./regress/c4004_rtl/rtl_03_bug.v
sec_reset:
  cycles: 3
  ports:
    - name: rst
      active_value: 1
signal_correspondence_step: 8
log_level: info
