# Issue 317: RTL 04 against RTL 01, the pair PDR once reported as different
# without a trace. Equivalent, with one instruction of eight clock cycles per
# step.
format: systemverilog
input_paths:
  - ./regress/c4004_rtl/rtl_01.v
  - ./regress/c4004_rtl/rtl_04.v
sec_reset:
  cycles: 3
  ports:
    - name: rst
      active_value: 1
signal_correspondence_step: 8
log_level: info
