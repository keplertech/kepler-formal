# Issue 317: RTL 02 keeps the program counter in registers beside the stack
# memory. Equivalent, proved by signal correspondence at one cycle per step.
format: systemverilog
input_paths:
  - ./regress/c4004_rtl/rtl_01.v
  - ./regress/c4004_rtl/rtl_02.v
sec_reset:
  cycles: 3
  ports:
    - name: rst
      active_value: 1
log_level: info
